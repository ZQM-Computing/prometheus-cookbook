# Prometheus 01-scrape-config — dev-instance scrape config.
# Fleet reference: Prometheus 3.15.1 on :9090, windows_exporter 0.32.0 on :9182
# (Node-1 and Node-3, both targets up). This file is for a DEV instance only —
# never copy it over a fleet prometheus.yml; the fleet's config is not managed here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: windows_exporter
    static_configs:
      - targets: ['localhost:9182']
